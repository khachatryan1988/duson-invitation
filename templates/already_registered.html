{% extends "base.html" %}

{% block title %}{{ t.already_registered }} — BAGHRAMYAN RESIDENCE{% endblock %}

{% block body %}

<!-- ===================================================== -->
<!-- ALREADY REGISTERED PAGE -->
<!-- ===================================================== -->

<section class="result-page">

    <!-- BACKGROUND -->
    <div class="result-bg"></div>


    <!-- RESULT CARD -->
    <div class="result-card">


        <!-- ================================================= -->
        <!-- LOGO -->
        <!-- ================================================= -->

        <div class="result-logo">

            <img
                    src="{{ url_for('static', filename='images/rezidence.png') }}"
                    alt="BAGHRAMYAN RESIDENCE"
            >

        </div>


        <!-- ================================================= -->
        <!-- KICKER -->
        <!-- ================================================= -->

        <p class="result-kicker">
            {{ t.registration_label }}
        </p>


        <!-- ================================================= -->
        <!-- TITLE -->
        <!-- ================================================= -->

        <h1>
            {{ t.already_registered }}
        </h1>


        <!-- ================================================= -->
        <!-- TEXT -->
        <!-- ================================================= -->

        <p class="result-text muted-result">
            {{ t.already_registered_text }}
        </p>


        <!-- ================================================= -->
        <!-- BACK LINK -->
        <!-- ================================================= -->

        <a
                class="back-link"
                href="{{ url_for('index', lang=lang) }}"
        >
            ← {{ t.back_home }}
        </a>

    </div>

</section>

{% endblock %}
