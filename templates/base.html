<!doctype html>

<html lang="{{ t.html_lang if t is defined else 'hy' }}">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >


    <!-- ===================================================== -->
    <!-- TITLE -->
    <!-- ===================================================== -->

    <title>
        {% block title %}
        Baghramyan Residence — Հատուկ հրավեր
        {% endblock %}
    </title>


    <!-- ===================================================== -->
    <!-- SEO -->
    <!-- ===================================================== -->

    <meta
            name="description"
            content="Հատուկ հրավեր Baghramyan Residence-ի միջոցառմանը Երևանում։"
    >


    <!-- ===================================================== -->
    <!-- OPEN GRAPH / WHATSAPP / FACEBOOK -->
    <!-- ===================================================== -->

    <meta
            property="og:type"
            content="website"
    >

    <meta
            property="og:locale"
            content="hy_AM"
    >

    <meta
            property="og:site_name"
            content="Baghramyan Residence"
    >

    <meta
            property="og:title"
            content="Baghramyan Residence — Հատուկ հրավեր"
    >

    <meta
            property="og:description"
            content="Հատուկ հրավեր Baghramyan Residence-ի միջոցառմանը Երևանում։"
    >

    <meta
            property="og:url"
            content="https://invitation.baghramyan-residence.am/{{ lang if lang else 'hy' }}"
    >


    <!-- ===================================================== -->
    <!-- PREVIEW IMAGE -->
    <!-- ===================================================== -->

    <meta
            property="og:image"
            content="https://invitation.baghramyan-residence.am/static/images/share-preview.jpg?v=5"
    >

    <meta
            property="og:image:secure_url"
            content="https://invitation.baghramyan-residence.am/static/images/share-preview.jpg?v=5"
    >

    <meta
            property="og:image:type"
            content="image/jpeg"
    >

    <meta
            property="og:image:width"
            content="1200"
    >

    <meta
            property="og:image:height"
            content="630"
    >

    <meta
            property="og:image:alt"
            content="Baghramyan Residence — Հատուկ հրավեր"
    >


    <!-- ===================================================== -->
    <!-- TWITTER / OTHER PREVIEWS -->
    <!-- ===================================================== -->

    <meta
            name="twitter:card"
            content="summary_large_image"
    >

    <meta
            name="twitter:title"
            content="Baghramyan Residence — Հատուկ հրավեր"
    >

    <meta
            name="twitter:description"
            content="Հատուկ հրավեր Baghramyan Residence-ի միջոցառմանը Երևանում։"
    >

    <meta
            name="twitter:image"
            content="https://invitation.baghramyan-residence.am/static/images/share-preview.jpg?v=5"
    >


    <!-- ===================================================== -->
    <!-- CSS -->
    <!-- ===================================================== -->

    <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

{% block body %}
{% endblock %}


<script
        src="{{ url_for('static', filename='js/main.js') }}"
        defer
></script>

</body>

</html>
