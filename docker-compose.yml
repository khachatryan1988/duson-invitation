services:

  # =====================================================
  # POSTGRESQL
  # =====================================================

  db:
    image: postgres:16-alpine
    container_name: duson_invitation_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - duson_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

    networks:
      - duson_network


  # =====================================================
  # FLASK WEB
  # =====================================================

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: duson_invitation_web
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:

      # =================================================
      # FLASK
      # =================================================

      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      PORT: 8000
      FLASK_DEBUG: 0


      # =================================================
      # POSTGRES CONNECTION
      # =================================================
      #
      # Эти переменные нужны app.py,
      # чтобы подключить:
      #
      # default  -> duson_event
      # decora   -> decora_event
      # prestige -> prestige_event
      #
      # =================================================

      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}

      DECORA_DB_NAME: ${DECORA_DB_NAME}
      PRESTIGE_DB_NAME: ${PRESTIGE_DB_NAME}


      # =================================================
      # LEGACY DATABASE
      # =================================================

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}


      # =================================================
      # QR SYSTEM INTEGRATION
      # =================================================

      QR_API_URL: ${QR_API_URL}
      QR_INTEGRATION_SECRET: ${QR_INTEGRATION_SECRET}


    ports:
      - "${APP_PORT}:8000"


    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


    networks:

      duson_network:

      invitation_shared:
        aliases:
          - invitation-web


# =====================================================
# VOLUMES
# =====================================================

volumes:

  duson_postgres_data:
    name: duson_invitation_postgres_data


# =====================================================
# NETWORKS
# =====================================================

networks:

  # ===================================================
  # PRIVATE NETWORK
  #
  # duson_invitation_web
  #        ↕
  # duson_invitation_db
  # ===================================================

  duson_network:
    name: duson_invitation_network


  # ===================================================
  # SHARED NETWORK
  #
  # invitation web
  #       ↕
  # QR system
  #       ↕
  # local nginx proxy
  # ===================================================

  invitation_shared:
    external: true
    name: invitation_shared